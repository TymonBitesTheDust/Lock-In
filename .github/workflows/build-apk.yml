name: Build APK

on:
  push:
    branches: [main]
    # The web app (web/) has its own workflow, web.yml.
    paths-ignore: ['web/**', '.github/workflows/web.yml']
    # Pushing a tag like v0.2.0 also publishes a GitHub Release with the APK (see the release job).
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Per ref, so a tag push and the matching main push don't cancel each other.
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Last entry becomes JAVA_HOME; 17 stays available as a toolchain.
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK Platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" || echo "::warning::sdkmanager could not install platforms;android-37; AGP will try"

      - name: Firebase config from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config written"
          else
            echo "::notice::No GOOGLE_SERVICES_JSON secret; building without Firebase (groups disabled)"
          fi

      - name: Run engine tests and assemble debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew :core:timer:test :core:model:test :app:assembleDebug --stacktrace --continue 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lock-in-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Mirrors the result (APK, log, errors) to the ci-output branch so it can be read with plain git.
      - name: Publish result to ci-output branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ steps.build.outcome }}
        run: |
          OUT="$RUNNER_TEMP/ci-output"
          mkdir -p "$OUT"
          if [ -f build.log ]; then cp build.log "$OUT/"; else echo "no build log" > "$OUT/build.log"; fi
          grep -nE "^e: |^w: .*error|error:|FAILURE|What went wrong|BUILD (SUCCESSFUL|FAILED)|Could not|^> |FAILED$" build.log 2>/dev/null | head -600 > "$OUT/errors.txt" || true
          cp app/build/outputs/apk/debug/*.apk "$OUT/" 2>/dev/null || true
          find . -path '*/build/test-results/*' -name '*.xml' -exec cp --parents {} "$OUT/" \; 2>/dev/null || true
          echo "sha=$GITHUB_SHA status=$STATUS run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$OUT/RESULT.txt"
          cd "$OUT"
          git init -q -b ci-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI $STATUS for $GITHUB_SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-output

  # Boots an emulator, walks every screen with scripts/ui-smoke.sh, and publishes screenshots and
  # crash logs to the ci-ui branch.
  ui:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: lock-in-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ui-smoke.sh apk/app-debug.apk ui-out

      - name: Publish screenshots to ci-ui branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ steps.smoke.outcome }}
        run: |
          OUT="$RUNNER_TEMP/ci-ui"
          mkdir -p "$OUT"
          cp -r ui-out/. "$OUT/" 2>/dev/null || echo "no output" > "$OUT/steps.txt"
          echo "sha=$GITHUB_SHA status=$STATUS run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$OUT/RESULT.txt"
          cd "$OUT"
          git init -q -b ci-ui
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI $STATUS for $GITHUB_SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-ui

  # Publishes the APK as a GitHub Release once the emulator run passed. A release is created
  # whenever main carries a versionName that has no release yet (bump the version to release),
  # or when a v* tag is pushed. Existing releases are never replaced by plain main pushes.
  # Permanent link: https://github.com/<owner>/<repo>/releases/latest/download/Lock-In.apk
  release:
    needs: [build, ui]
    if: ${{ github.event_name == 'push' && needs.build.result == 'success' && needs.ui.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: lock-in-debug-apk
          path: apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi
          cp apk/app-debug.apk Lock-In.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              gh release upload "$TAG" Lock-In.apk --clobber
            else
              echo "::notice::Release $TAG already exists; bump versionName to publish a new one."
            fi
          else
            gh release create "$TAG" Lock-In.apk \
              --target "$GITHUB_SHA" \
              --title "Lock In $VERSION" \
              --notes-file .github/release-notes.md \
              --latest
            echo "::notice::Published $TAG"
          fi
