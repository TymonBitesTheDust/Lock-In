<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lock In</title>
    <meta name="description" content="Study timer, planner and study groups. Counts every second you study, even with the screen off." />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1216" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- iPhone: opened from the Home Screen, Lock In runs full-screen like an app. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lock In" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Light or dark chosen in Settings, set before the first paint so there's no flash. -->
    <script>
      try {
        var mode = JSON.parse(localStorage.getItem('lockin.prefs') || '{}').themeMode;
        if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Lock In needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
